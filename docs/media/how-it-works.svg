<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6173F2"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141629"/>
      <stop offset="1" stop-color="#0B0C14"/>
    </linearGradient>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)"/>

  <!-- column 1: the window -->
  <g>
    <rect x="28" y="150" width="150" height="120" rx="12" fill="#191B2B" stroke="#3A3F5C"/>
    <text x="103" y="196" text-anchor="middle" fill="#F4F6FF" font-size="16" font-weight="700">Any window</text>
    <text x="103" y="220" text-anchor="middle" fill="#9AA0B4" font-size="12.5">browser, chat, docs…</text>
    <text x="103" y="244" text-anchor="middle" fill="#9AA0B4" font-size="12.5">you drop it on</text>
  </g>

  <!-- column 2: seeing -->
  <g>
    <rect x="232" y="40" width="200" height="86" rx="12" fill="#191B2B" stroke="#6173F2"/>
    <text x="332" y="72" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Window capture</text>
    <text x="332" y="94" text-anchor="middle" fill="#9AA0B4" font-size="12">that window's own pixels</text>
    <text x="332" y="112" text-anchor="middle" fill="#9AA0B4" font-size="12">+ scroll tracking, 90×/s</text>

    <rect x="232" y="167" width="200" height="86" rx="12" fill="#191B2B" stroke="#6173F2"/>
    <text x="332" y="199" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Text reader</text>
    <text x="332" y="221" text-anchor="middle" fill="#9AA0B4" font-size="12">Windows OCR, 2× upscale</text>
    <text x="332" y="239" text-anchor="middle" fill="#9AA0B4" font-size="12">words with exact positions</text>

    <rect x="232" y="294" width="200" height="86" rx="12" fill="#191B2B" stroke="#6173F2"/>
    <text x="332" y="326" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Browser mode</text>
    <text x="332" y="348" text-anchor="middle" fill="#9AA0B4" font-size="12">accessibility tree: real links,</text>
    <text x="332" y="366" text-anchor="middle" fill="#9AA0B4" font-size="12">headings, web addresses</text>
  </g>

  <!-- column 3: understanding -->
  <g>
    <rect x="486" y="128" width="190" height="164" rx="12" fill="#191B2B" stroke="#8BF5A6"/>
    <text x="581" y="162" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Page model</text>
    <text x="581" y="188" text-anchor="middle" fill="#93F5AE" font-size="12.5">key sentences</text>
    <text x="581" y="208" text-anchor="middle" fill="#93F5AE" font-size="12.5">DOIs · ISBNs · paper IDs</text>
    <text x="581" y="228" text-anchor="middle" fill="#93F5AE" font-size="12.5">titles · links · headings</text>
    <text x="581" y="248" text-anchor="middle" fill="#93F5AE" font-size="12.5">table rows · cards</text>
    <text x="581" y="274" text-anchor="middle" fill="#9AA0B4" font-size="12">in page coordinates</text>
  </g>

  <!-- column 4: acting -->
  <g>
    <rect x="730" y="40" width="200" height="104" rx="12" fill="#191B2B" stroke="#E33CD2"/>
    <text x="830" y="72" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Spider mind</text>
    <text x="830" y="94" text-anchor="middle" fill="#9AA0B4" font-size="12">picks the next find,</text>
    <text x="830" y="112" text-anchor="middle" fill="#9AA0B4" font-size="12">reads top to bottom,</text>
    <text x="830" y="130" text-anchor="middle" fill="#9AA0B4" font-size="12">local AI notes (optional)</text>

    <rect x="730" y="178" width="200" height="92" rx="12" fill="#191B2B" stroke="#E33CD2"/>
    <text x="830" y="210" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Overlay</text>
    <text x="830" y="232" text-anchor="middle" fill="#9AA0B4" font-size="12">Direct2D legs, lasso,</text>
    <text x="830" y="250" text-anchor="middle" fill="#9AA0B4" font-size="12">restyled text, thought bubble</text>

    <rect x="730" y="304" width="200" height="86" rx="12" fill="#191B2B" stroke="#E33CD2"/>
    <text x="830" y="336" text-anchor="middle" fill="#F4F6FF" font-size="15" font-weight="700">Harvest panel</text>
    <text x="830" y="358" text-anchor="middle" fill="#9AA0B4" font-size="12">click to jump to it,</text>
    <text x="830" y="376" text-anchor="middle" fill="#9AA0B4" font-size="12">save JSON / CSV</text>
  </g>

  <!-- arrows -->
  <g stroke="#6173F2" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M178 190 C 205 160, 210 100, 230 88"/>
    <path d="M178 210 L 230 210"/>
    <path d="M178 230 C 205 260, 210 320, 230 334"/>
    <path d="M432 83 C 462 90, 466 150, 484 168"/>
    <path d="M432 210 L 484 210"/>
    <path d="M432 337 C 462 330, 466 270, 484 252"/>
    <path d="M676 180 C 700 160, 705 105, 728 95"/>
    <path d="M676 214 L 728 222"/>
    <path d="M676 250 C 700 270, 705 335, 728 345"/>
  </g>
  <text x="480" y="414" text-anchor="middle" fill="#5C6275" font-size="12">everything runs on your PC · the only network call is to a local Ollama, if you have one</text>
</svg>
